<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="layout.css" rel="stylesheet">
</head>

<body>
    <div class="contenitore">

        <div class="box">Elemento</div>

    </div>


    <h3 class="space">display grid</h3>
    <div class="container_1 space">

        <div class="item">box grid 1 </div>

        <div class="item">box grid 2</div>

        <div class="item">box grid 3</div>

    </div>


    <h3 class="space">display flex</h3>
    <div class="container_2 space">

        <div class="item">box flex 1</div>

        <div class="item">box flex 2</div>

        <div class="item">box flex 3</div>

    </div>

    <h3 class="space">display grid con righe</h3>
    <div class="container_3 space">

        <div class="item item3">A</div>

        <div class="item item4">B</div>

        <div class="item round">C</div>

    </div>


    <h3 class="space">display grid template areas</h3>
    <div class="container_4 space">

        <div class="header">Header</div>

        <div class="sidebar">Sidebar</div>

        <div class="content">Content</div>

        <div class="footer">Footer</div>

    </div>

</body>

</html>
